<svg xmlns="http://www.w3.org/2000/svg" width="780" height="516" viewBox="0 0 780 516" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">

  <!-- ══ Screen background ══ -->
  <rect x="0" y="0" width="780" height="516" rx="12" fill="#1F1E1D"/>

  <!-- ══ $ claude ══ -->
  <text x="30" y="36"><tspan fill="#7EE787">$</tspan><tspan fill="#E8E6E3" dx="8">claude</tspan></text>

  <!-- ══ Claude Code header box ══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.4s" fill="freeze"/>

    <rect x="30" y="54" width="720" height="212" rx="8" fill="none" stroke="#4A4A46"/>
    <line x1="252" y1="55" x2="252" y2="265" stroke="#4A4A46"/>
    <!-- title on border -->
    <rect x="48" y="46" width="180" height="16" fill="#1F1E1D"/>
    <text x="58" y="59" fill="#D97757" font-weight="bold">Claude Code <tspan fill="#8A8A86" font-weight="normal">v2.1.217</tspan></text>

    <!-- left column -->
    <text x="141" y="94" text-anchor="middle" fill="#E8E6E3">Welcome back jjunny!</text>
    <g fill="#D97757" font-size="17" text-anchor="middle">
      <text x="141" y="141">▐▛███▜▌</text>
      <text x="141" y="160">▝▜█████▛▘</text>
      <text x="141" y="179">▘▘ ▝▝</text>
    </g>
    <text x="141" y="218" text-anchor="middle" fill="#8A8A86" font-size="12">Opus 4.8 · Claude Max</text>
    <text x="141" y="240" text-anchor="middle" fill="#8A8A86" font-size="12">~/Desktop/jjunny</text>

    <!-- right column -->
    <text x="274" y="89" fill="#E8E6E3" font-weight="bold">Tips for getting started</text>
    <text x="274" y="113" fill="#8A8A86" font-size="13">Run /init to create a CLAUDE.md file with instructions</text>
    <line x1="274" y1="128" x2="728" y2="128" stroke="#3A3A38"/>
    <text x="274" y="152" fill="#E8E6E3" font-weight="bold">What's new</text>
    <text x="274" y="176" fill="#8A8A86" font-size="13">Added emoji shortcode autocomplete in the prompt input</text>
    <text x="274" y="198" fill="#8A8A86" font-size="13">Fixed a memory leak in truncated MCP tool outputs</text>
    <text x="274" y="226" fill="#8A8A86" font-size="13">/release-notes for more</text>
  </g>

  <!-- ══ > whoami (typing) ══ -->
  <text x="30" y="304" fill="#D97757">&gt;</text>
  <clipPath id="typeClip">
    <rect x="52" y="288" width="0" height="22">
      <animate attributeName="width" values="0;9;18;27;36;45;54" dur="0.9s" begin="1.1s" calcMode="discrete" fill="freeze"/>
    </rect>
  </clipPath>
  <text x="54" y="304" fill="#E8E6E3" clip-path="url(#typeClip)">whoami</text>

  <!-- ══ Response ══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.4s" fill="freeze"/>
    <circle cx="36" cy="336" r="4.5" fill="#D97757"/>
    <text x="54" y="341" fill="#E8E6E3" font-weight="bold">jjunny <tspan fill="#8A8A86" font-weight="normal">—</tspan> Frontend Developer</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.75s" fill="freeze"/>
    <text x="54" y="369" fill="#B8B5B0">React와 Next.js로 사용자 경험을 만드는 프론트엔드 개발자입니다.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
    <text x="54" y="403">🎯 <tspan fill="#D97757" dx="6">Focus</tspan><tspan fill="#E8E6E3" x="200">Frontend Development</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.3s" fill="freeze"/>
    <text x="54" y="429">⚡ <tspan fill="#D97757" dx="6">Stack</tspan><tspan fill="#E8E6E3" x="200">React · Next.js · TypeScript</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.5s" fill="freeze"/>
    <text x="54" y="455">📬 <tspan fill="#D97757" dx="6">Contact</tspan><tspan fill="#E8E6E3" x="200">rudwns9026@gmail.com</tspan></text>
  </g>

  <!-- ══ Final prompt + blinking cursor ══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4s" fill="freeze"/>
    <text x="30" y="494" fill="#D97757">&gt;</text>
    <rect x="52" y="480" width="9" height="18" fill="#E8E6E3">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
