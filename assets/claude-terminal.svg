<svg xmlns="http://www.w3.org/2000/svg" width="780" height="630" viewBox="0 0 780 630" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">

  <style>
    /* ══ Theme-adaptive colors (GitHub dark/light) ══ */
    .c-fg     { fill: #E8E6E3 }
    .c-soft   { fill: #B8B5B0 }
    .c-muted  { fill: #8A8A86 }
    .c-accent { fill: #D97757 }
    .c-green  { fill: #7EE787 }
    .c-border { stroke: #4A4A46 }
    .c-hr     { stroke: #3A3A38 }
    .c-underline { fill: #D97757 }
    @media (prefers-color-scheme: light) {
      .c-fg     { fill: #1F2328 }
      .c-soft   { fill: #454C54 }
      .c-muted  { fill: #59636E }
      .c-accent { fill: #C15F3C }
      .c-green  { fill: #1A7F37 }
      .c-border { stroke: #D1D9E0 }
      .c-hr     { stroke: #D8DEE4 }
      .c-underline { fill: #C15F3C }
    }

    /* ══ Animations ══
       Base state = fully visible, so frozen/reduced-motion renderers
       still show the complete terminal. Each keyframe dips to hidden
       right after 0% and reveals at its scheduled time (T = 4.5s). */
    #box    { animation: kBox    4.5s linear forwards }
    #typed  { animation: kType   4.5s linear forwards }
    #tabs   { animation: kTabs   4.5s linear forwards }
    #rows1  { animation: kRows1  4.5s linear forwards }
    #rows2  { animation: kRows2  4.5s linear forwards }
    #rows3  { animation: kRows3  4.5s linear forwards }
    #prompt { animation: kPrompt 4.5s linear forwards }
    #cursor { animation: blink 1.1s step-end 4.5s infinite }

    @keyframes kBox    { 0% {opacity:1} 1% {opacity:0} 8.9% {opacity:0} 16.7% {opacity:1} 100% {opacity:1} }
    @keyframes kTabs   { 0% {opacity:1} 1% {opacity:0} 51.1% {opacity:0} 57.8% {opacity:1} 100% {opacity:1} }
    @keyframes kRows1  { 0% {opacity:1} 1% {opacity:0} 60% {opacity:0} 66.7% {opacity:1} 100% {opacity:1} }
    @keyframes kRows2  { 0% {opacity:1} 1% {opacity:0} 66.7% {opacity:0} 73.3% {opacity:1} 100% {opacity:1} }
    @keyframes kRows3  { 0% {opacity:1} 1% {opacity:0} 73.3% {opacity:0} 80% {opacity:1} 100% {opacity:1} }
    @keyframes kPrompt { 0% {opacity:1} 1% {opacity:0} 88.9% {opacity:0} 92.2% {opacity:1} 100% {opacity:1} }

    /* typewriter: reveal "/status" one char at a time via clip-path steps */
    @keyframes kType {
      0%     { clip-path: none }
      1%     { clip-path: inset(-20% 100% -20% 0) }
      24.4%  { clip-path: inset(-20% 100% -20% 0) }
      24.5%  { clip-path: inset(-20% 85.7% -20% 0) }
      27.3%  { clip-path: inset(-20% 85.7% -20% 0) }
      27.4%  { clip-path: inset(-20% 71.4% -20% 0) }
      30.1%  { clip-path: inset(-20% 71.4% -20% 0) }
      30.2%  { clip-path: inset(-20% 57.1% -20% 0) }
      33%    { clip-path: inset(-20% 57.1% -20% 0) }
      33.1%  { clip-path: inset(-20% 42.9% -20% 0) }
      35.8%  { clip-path: inset(-20% 42.9% -20% 0) }
      35.9%  { clip-path: inset(-20% 28.6% -20% 0) }
      38.7%  { clip-path: inset(-20% 28.6% -20% 0) }
      38.8%  { clip-path: inset(-20% 14.3% -20% 0) }
      41.5%  { clip-path: inset(-20% 14.3% -20% 0) }
      41.6%  { clip-path: inset(-20% -5% -20% 0) }
      100%   { clip-path: inset(-20% -5% -20% 0) }
    }
    @keyframes blink { 0% {opacity:1} 50% {opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      #box, #typed, #tabs, #rows1, #rows2, #rows3, #prompt, #cursor { animation: none }
    }
  </style>

  <!-- ══ $ claude ══ -->
  <text x="30" y="36"><tspan class="c-green">$</tspan><tspan class="c-fg" dx="8">claude</tspan></text>

  <!-- ══ Claude Code header box ══ -->
  <g id="box">
    <!-- border with a gap on the top edge for the title -->
    <path class="c-border" fill="none" d="M 244 54 L 742 54 Q 750 54 750 62 L 750 258 Q 750 266 742 266 L 38 266 Q 30 266 30 258 L 30 62 Q 30 54 38 54 L 46 54"/>
    <line class="c-border" x1="252" y1="55" x2="252" y2="265"/>
    <!-- title sitting in the border gap -->
    <text x="56" y="59" class="c-accent" font-weight="bold">Claude Code <tspan class="c-muted" font-weight="normal">v10.31.1998</tspan></text>

    <!-- left column -->
    <text x="141" y="94" text-anchor="middle" class="c-fg">Welcome back jjunny!</text>
    <g class="c-accent" font-size="17" text-anchor="middle">
      <text x="141" y="141">▐▛███▜▌</text>
      <text x="141" y="160">▝▜█████▛▘</text>
      <text x="141" y="179">▘▘ ▝▝</text>
    </g>
    <text x="141" y="218" text-anchor="middle" class="c-muted" font-size="12">Opus 4.8 · Claude Max</text>
    <text x="141" y="240" text-anchor="middle" class="c-muted" font-size="12">~/Desktop/jjunny</text>

    <!-- right column -->
    <text x="274" y="89" class="c-fg" font-weight="bold">Tips for getting started</text>
    <text x="274" y="113" class="c-muted" font-size="13">Run /init to create a CLAUDE.md file with instructions</text>
    <line class="c-hr" x1="274" y1="128" x2="728" y2="128"/>
    <text x="274" y="152" class="c-fg" font-weight="bold">What's new</text>
    <text x="274" y="176" class="c-muted" font-size="13">Added emoji shortcode autocomplete in the prompt input</text>
    <text x="274" y="198" class="c-muted" font-size="13">Fixed a memory leak in truncated MCP tool outputs</text>
    <text x="274" y="226" class="c-muted" font-size="13">/release-notes for more</text>
  </g>

  <!-- ══ > /status (typing) ══ -->
  <text x="30" y="304" class="c-accent">&gt;</text>
  <text id="typed" x="54" y="304" class="c-accent">/status</text>

  <!-- ══ Status panel: tabs + separator ══ -->
  <g id="tabs">
    <line class="c-hr" x1="30" y1="322" x2="750" y2="322"/>
    <text x="54" y="350" class="c-muted" font-size="13">Settings</text>
    <text x="140" y="350" class="c-accent" font-size="13" font-weight="bold">Status</text>
    <rect class="c-underline" x="138" y="356" width="51" height="2"/>
    <text x="212" y="350" class="c-muted" font-size="13">Config</text>
    <text x="282" y="350" class="c-muted" font-size="13">Usage</text>
    <text x="344" y="350" class="c-muted" font-size="13">Stats</text>
  </g>

  <!-- ══ Status rows ══ -->
  <g id="rows1" font-size="13">
    <text x="54" y="388" class="c-muted">Version:</text>          <text x="230" y="388" class="c-fg">v10.31.1998</text>
    <text x="54" y="412" class="c-muted">Session name:</text>     <text x="230" y="412" class="c-fg">jjunny</text>
    <text x="54" y="436" class="c-muted">Session ID:</text>       <text x="230" y="436" class="c-fg">6a6a756e-6e79-1031-1998-cafec0ffee42</text>
  </g>
  <g id="rows2" font-size="13">
    <text x="54" y="460" class="c-muted">cwd:</text>              <text x="230" y="460" class="c-fg">~/Desktop/jjunny</text>
    <text x="54" y="484" class="c-muted">Login method:</text>     <text x="230" y="484" class="c-fg">Claude Max account</text>
    <text x="54" y="508" class="c-muted">Role:</text>             <text x="230" y="508" class="c-fg">Frontend Developer</text>
  </g>
  <g id="rows3" font-size="13">
    <text x="54" y="532" class="c-muted">Email:</text>            <text x="230" y="532" class="c-fg">rudwns9026@gmail.com</text>
    <text x="54" y="556" class="c-muted">Model:</text>            <text x="230" y="556" class="c-fg">claude-opus-4-8[1m]</text>
    <text x="54" y="580" class="c-muted">MCP servers:</text>      <text x="230" y="580" class="c-fg">React · Next.js · TypeScript <tspan class="c-green">connected</tspan> <tspan class="c-muted">· /mcp</tspan></text>
  </g>

  <!-- ══ Final prompt + blinking cursor ══ -->
  <g id="prompt">
    <text x="30" y="618" class="c-accent">&gt;</text>
    <rect id="cursor" x="52" y="604" width="9" height="18" class="c-fg"/>
  </g>
</svg>
